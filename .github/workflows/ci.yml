name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: bun ci
      - run: bun audit --audit-level=high
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      # dist/ must exist before cargo: tauri::generate_context! embeds it.
      - run: bun run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # crates/strate-core/data/prices.json is vendored byte-for-byte from claude-config.
  prices-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Crawford-Young/claude-config
          ref: main
          path: claude-config
      - run: cmp crates/strate-core/data/prices.json claude-config/scripts/prices.json

  # cargo test compares strate to the committed audit.mjs golden; this re-runs
  # audit.mjs live so its drift surfaces. Node runs nothing else.
  audit-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Crawford-Young/claude-config
          ref: main
          path: claude-config
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: node claude-config/scripts/audit.mjs --root crates/strate-core/tests/fixtures/cost-home/projects --json > audit.json
      - run: node crates/strate-core/tests/fixtures/audit-golden.mjs --check crates/strate-core/tests/fixtures/audit-golden.json audit.json
