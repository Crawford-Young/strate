[package]
name = "strate-core"
version = "0.1.0"
description = "Claude Code transcript discovery and graph model for strate"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
crossbeam-channel = "0.5.17"
file-id = "0.2.3"
# verified: 2026-10: maintained, already in the lock; tzdb-bundle-platform since Windows has no system tzdb.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform"] }
notify = "8.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
