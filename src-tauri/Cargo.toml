[package]
name = "strate"
version = "0.1.0"
description = "Real-time view of Claude Code orchestration"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "strate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2.8.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
strate-core = { path = "../crates/strate-core" }

[dev-dependencies]
serde_json = "1.0.151"
